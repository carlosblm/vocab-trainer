[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocab"
version = "0.1.0"
description = "Aplicación de estudio de vocabulario a partir del vocab.db de Kindle."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "spacy",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "testcontainers[postgresql]>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vocab"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["vocab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["vocab"]
strict = true
