[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocab"
version = "0.1.0"
description = "Aplicación de estudio de vocabulario a partir del vocab.db de Kindle."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "spacy",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "testcontainers[postgresql]>=4.15.0",
    "import-linter>=2.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vocab"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["vocab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["vocab"]
strict = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "vocab"
# Necesario para que el contrato `forbidden` vea paquetes que no son `vocab`.
include_external_packages = true

# Las capas, de la más externa a la más interna. `|` marca hermanos
# independientes: ni `adapters` puede importar de `application` ni al revés.
# Es la regla que distingue una arquitectura hexagonal de una en capas.
[[tool.importlinter.contracts]]
name = "Las dependencias apuntan siempre hacia el dominio"
type = "layers"
layers = [
    "vocab.cli",
    "vocab.adapters | vocab.application",
    "vocab.ports",
    "vocab.domain",
]

# La fila `domain` de la tabla: solo biblioteca estándar.
[[tool.importlinter.contracts]]
name = "El dominio no importa nada de terceros"
type = "forbidden"
source_modules = ["vocab.domain"]
forbidden_modules = [
    "sqlalchemy",
    "spacy",
    "pydantic",
    "pydantic_settings",
    "alembic",
    "psycopg",
]
